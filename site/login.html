<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>해백이 로그인</title><link rel="stylesheet" href="/assets/auth.css"><link rel="icon" href="/assets/icons/favicon-32.png" type="image/png"><script src="/assets/auth-client.js" defer></script></head>
<body data-page="login"><main class="login-page"><div class="brand-logo" role="img" aria-label="인제대학교 해운대백병원 간호국"></div><div class="haebaek-scene login-character" role="img" aria-label="해백이 캐릭터"></div><h1>간호국 챗봇 해백이</h1><p class="login-subtitle">공용 계정으로 로그인해주세요.</p>
<section class="login-card"><form id="login-form"><label for="login-account">계정</label><select id="login-account" name="account" required><option value="staff">직원 공용 계정</option><option value="admin">관리자 계정</option></select><label for="login-password">비밀번호</label><input id="login-password" name="password" type="password" autocomplete="current-password" required maxlength="128"><label class="check"><input name="remember" type="checkbox">30일 동안 로그인 유지</label><button class="primary-button" type="submit">로그인</button><p id="status" role="status" aria-live="polite"></p></form></section>
<details class="account-notice"><summary>공용 PC 사용 안내</summary><p>공용 PC에서는 로그인 유지를 선택하지 말고, 사용 후 반드시 로그아웃해주세요. 각 브라우저의 로그인 세션은 서로 독립적으로 유지됩니다.</p></details></main></body></html>
