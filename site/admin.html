<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 · 해백이</title><link rel="stylesheet" href="/assets/auth.css"><link rel="icon" href="/assets/icons/favicon-32.png" type="image/png"><script src="/assets/ui.js" defer></script><script src="/assets/auth-client.js" defer></script></head>
<body data-page="admin"><main><h1>관리자 계정</h1><p id="account-summary">관리자 권한을 확인하고 있습니다.</p><section><h2>관리 기능</h2><p>관리자 PPT 관리와 피드백 관리는 다음 단계에서 연결됩니다. 현재 화면은 서버에서 관리자 권한을 확인한 경우에만 열립니다.</p></section><section><h2>관리자 비밀번호 변경</h2><p class="muted">변경하면 관리자 계정의 모든 기존 세션이 무효화됩니다.</p><form id="password-form"><label for="current-password">현재 비밀번호</label><input id="current-password" name="current_password" type="password" autocomplete="current-password" required maxlength="128"><label for="new-password">새 비밀번호</label><input id="new-password" name="new_password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><label for="confirm-password">새 비밀번호 확인</label><input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><button class="primary-button" type="submit">비밀번호 변경</button></form><p id="status" role="status" aria-live="polite"></p></section><nav><a href="/">챗봇으로 돌아가기</a><button type="button" data-logout>로그아웃</button></nav></main></body></html>
