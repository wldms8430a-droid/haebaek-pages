<body data-page="account"><main><h1>내 정보</h1><p id="account-summary">로그인 정보를 확인하고 있습니다.</p><section><h2>비밀번호 변경</h2><p class="muted">변경하면 이 계정으로 로그인된 모든 브라우저의 기존 세션이 무효화됩니다.</p><form id="password-form"><label for="current-password">현재 비밀번호</label><input id="current-password" name="current_password" type="password" autocomplete="current-password" required maxlength="128"><label for="new-password">새 비밀번호</label><input id="new-password" name="new_password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><label for="confirm-password">새 비밀번호 확인</label><input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><button class="primary-button" type="submit">비밀번호 변경</button></form><p id="status" role="status" aria-live="polite"></p></section><nav><a href="/">챗봇으로 돌아가기</a><button type="button" data-logout>로그아웃</button></nav></main></body></html>
